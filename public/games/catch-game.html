<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>接浆果 🍓</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(180deg,#FFF8F0,#FDF0F3);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:'PingFang SC',sans-serif}
.score{font-size:24px;color:#FF8FA3;font-weight:700;margin-bottom:8px}
#canvas{background:linear-gradient(180deg,#C8E6C9,#A5D6A7);border-radius:16px}
.game-over{display:none;text-align:center;background:white;padding:24px;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.1);margin-top:16px}
button{background:linear-gradient(135deg,#F4A0B5,#FF8FA3);border:none;color:white;padding:12px 32px;border-radius:24px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
</style></head><body>
<h2>🍓 接浆果</h2><div class="score">得分: <span id="score">0</span> | 💎 <span id="gems">0</span></div>
<canvas id="canvas" width="400" height="550"></canvas>
<div class="game-over" id="go"><h3>游戏结束</h3><p>得分: <span id="fs">0</span></p><p>获得 💎 <span id="eg">0</span></p><button onclick="location.reload()">再来一次</button></div>
<script>
const W=400,H=550,c=document.getElementById('canvas'),ctx=c.getContext('2d');
let player={x:180,w:60,h:60},items=[],score=0,gems=0,frame=0,playing=true;
function spawn(){items.push({x:Math.random()*(W-30),y:-30,w:30,h:30,type:Math.random()<0.25?'rock':'berry',speed:2+Math.random()*4})}
for(let i=0;i<6;i++){let it={x:Math.random()*(W-30),y:-50-i*100,w:30,h:30,type:'berry',speed:2+Math.random()*4};items.push(it)}
c.addEventListener('mousemove',e=>{player.x=e.offsetX-player.w/2});c.addEventListener('touchmove',e=>{e.preventDefault();player.x=e.touches[0].clientX-c.getBoundingClientRect().left-player.w/2});
function update(){if(!playing)return;frame++;if(frame%40===0)spawn();for(let i of items){i.y+=i.speed;
  if(i.y>H-30&&i.x+30>player.x&&i.x<player.x+60){if(i.type==='berry'){score+=10;gems++}else{score=Math.max(0,score-20)}
    i.y=-30;i.x=Math.random()*(W-30);i.type=Math.random()<0.3?'rock':'berry';i.speed=2+Math.random()*4}
  if(i.y>H+50)playing=false}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#5C8D6E';ctx.font='50px sans-serif';ctx.fillText('🧸',player.x,player.y+50);
  for(let i of items){ctx.font='30px sans-serif';ctx.fillText(i.type==='berry'?'🍓':'🪨',i.x,i.y+30)}}
function loop(){update();draw();document.getElementById('score').textContent=score;document.getElementById('gems').textContent=gems;
  if(!playing){document.getElementById('fs').textContent=score;document.getElementById('eg').textContent=gems;document.getElementById('go').style.display='block'}
  if(playing)requestAnimationFrame(loop)}loop();
</script></body></html>
