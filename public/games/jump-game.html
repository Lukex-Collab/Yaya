<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>牙牙跳一跳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#87CEEB,#E0F7FA 50%,#A5D6A7);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:'PingFang SC',sans-serif;touch-action:none}
h1{position:absolute;top:20px;font-size:24px;color:#2E5C3D;z-index:10;text-shadow:0 2px 8px rgba(255,255,255,0.5)}
.score{position:absolute;top:60px;font-size:18px;color:#FF8FA3;font-weight:700;z-index:10}
#canvas{border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.1)}
.game-over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:24px;padding:32px 48px;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,0.15);display:none;z-index:20}
.game-over h2{font-size:28px;color:#FF8FA3;margin-bottom:12px}
.game-over .final-score{font-size:40px;font-weight:700;color:#5C3D2E}
.game-over button{margin-top:16px;padding:12px 32px;border:none;border-radius:24px;background:linear-gradient(135deg,#F4A0B5,#FF8FA3);color:white;font-size:18px;font-weight:600;cursor:pointer}
.gems{position:absolute;top:60px;right:20px;font-size:14px;color:#FF8F00;z-index:10}
</style>
</head>
<body>
<h1>🧸 牙牙跳一跳</h1>
<div class="score">得分: <span id="score">0</span></div>
<div class="gems">💎 <span id="gems">0</span></div>

<canvas id="canvas" width="400" height="600"></canvas>

<div class="game-over" id="gameOver">
  <h2>🏆 游戏结束</h2>
  <div class="final-score" id="finalScore">0</div>
  <p style="color:#9B8B8B;margin:8px 0">获得 💎 <span id="earnedGems">0</span> 宝石</p>
  <p style="color:#F4A0B5;font-size:13px">宝石已存入你的牙牙账户！</p>
  <button onclick="restart()">再来一次</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 400, H = 600;

// Load sprite
const sprite = new Image();
sprite.src = '../assets/45687.png'; // yaya sprite sheet
let spriteLoaded = false;
sprite.onload = () => spriteLoaded = true;

// Game state
let platforms = [];
let player = { x: 50, y: 0, vy: 0, width: 50, height: 50, onGround: false };
let score = 0, gems = 0, gameRunning = true, cameraY = 0;
let keys = {};

// Platform gen
let platformGap = 120;
let lastPlatformY = 500;

function initPlatforms() {
  platforms = [{ x: 0, y: 520, width: 120, height: 15 }]; // starting platform
  player.y = platforms[0].y - player.height;
  player.vy = 0;
  player.onGround = true;

  while (lastPlatformY > -H * 4) {
    generatePlatform();
  }
}

function generatePlatform() {
  const w = 60 + Math.random() * 80;
  const x = Math.random() * (W - w);
  lastPlatformY -= platformGap + Math.random() * 30;
  platforms.push({ x, y: lastPlatformY, width: w, height: 12, hasGem: Math.random() < 0.3 });
}

function update() {
  if (!gameRunning) return;

  // Gravity
  player.vy += 0.4;
  player.y += player.vy;
  player.onGround = false;

  // Keyboard input (desktop) / auto-jump on touch
  if (keys[' '] || keys['ArrowUp'] || mouseDown) {
    if (player.onGround || player.vy < 2 && player.vy > -1) { // near ground
      player.vy = -10;
    }
  }

  // Platform collision
  for (let p of platforms) {
    if (player.vy > 0 &&
        player.y + player.height >= p.y && player.y + player.height <= p.y + p.height + 15 &&
        player.x + player.width > p.x && player.x < p.x + p.width) {
      player.y = p.y - player.height;
      player.vy = 0;
      player.onGround = true;
      if (p.hasGem && !p.collected) {
        p.collected = true;
        gems++;
        document.getElementById('gems').textContent = gems;
      }
    }
  }

  // Camera follow
  if (player.y < cameraY + H/3) {
    cameraY = player.y - H/3;
    score += Math.floor(-player.vy);
    document.getElementById('score').textContent = score;
  }

  // Generate more platforms
  while (lastPlatformY > cameraY - H * 2) {
    generatePlatform();
  }

  // Fall off screen
  if (player.y > cameraY + H + 100) {
    gameOver();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(0.4, '#E0F7FA');
  grad.addColorStop(0.7, '#A5D6A7');
  grad.addColorStop(1, '#81C784');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 3; i++) {
    let cx = (50 + i * 140 + (cameraY * 0.1)) % (W + 200) - 100;
    let cy = (100 + i * 60 - cameraY * 0.05) % (H + 100) - 50;
    ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+25, cy-10, 25, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-20, cy+5, 20, 0, Math.PI*2); ctx.fill();
  }

  // Platforms
  for (let p of platforms) {
    let py = p.y - cameraY;
    if (py < -50 || py > H + 50) continue;
    ctx.fillStyle = '#5C8D6E';
    ctx.fillRect(p.x, py, p.width, p.height);
    // Gem
    if (p.hasGem && !p.collected) {
      ctx.font = '20px sans-serif';
      ctx.fillText('💎', p.x + p.width/2 - 12, py - 10);
    }
  }

  // Player (yaya)
  let px = player.x - 10;
  let py = player.y - cameraY;
  if (spriteLoaded) {
    // Draw sprite frame (use simple frame animation)
    let frame = Math.floor(Date.now() / 150) % 4;
    let sx = frame * 64; // assume 64px per frame
    ctx.drawImage(sprite, sx, 0, 64, 64, px, py, 70, 70);
  } else {
    // Fallback: emoji + bouncing animation
    ctx.font = '50px sans-serif';
    let bounce = player.onGround ? Math.sin(Date.now() / 200) * 3 : 0;
    ctx.fillText('🧸', px, py + 55 + bounce);
  }
}

function gameOver() {
  gameRunning = false;
  let earned = Math.floor(gems * 1.5);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('earnedGems').textContent = earned;
  document.getElementById('gameOver').style.display = 'block';
  // Save gems via API
  try {
    fetch('/api/v1/wellness/steps', {
      method: 'POST', headers: {'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('lingpal_token')||''},
      body: JSON.stringify({steps: score * 10})
    }).catch(()=>{});
  } catch(e) {}
}

function restart() {
  platforms = [];
  lastPlatformY = 500;
  score = 0; gems = 0; cameraY = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('gems').textContent = '0';
  document.getElementById('gameOver').style.display = 'none';
  gameRunning = true;
  player.y = 0; player.vy = 0;
  initPlatforms();
}

// Input
let mouseDown = false;
document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('touchstart', e => { mouseDown = true; e.preventDefault(); });
canvas.addEventListener('touchend', () => mouseDown = false);
canvas.addEventListener('mousedown', () => mouseDown = true);
canvas.addEventListener('mouseup', () => mouseDown = false);

// Game loop
initPlatforms();
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
