<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const petId = q.get('pet') || 'yaya';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(512, 512);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);

scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6a4a7a, 1.3));
const key = new THREE.DirectionalLight(0xfff0dd, 2.0);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fd0ff, 1.4);
rim.position.set(-4, 2, -3);
scene.add(rim);

new GLTFLoader().load(`../assets/pets/src/${petId}.glb`, (g) => {
  const pet = g.scene;
  scene.add(pet);
  // 自动取景：包围盒适配，3/4 视角
  const box = new THREE.Box3().setFromObject(pet);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const d = Math.max(size.x, size.y, size.z);
  camera.position.set(center.x + d * 1.1, center.y + d * 0.5, center.z + d * 1.35);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  window.__done = true;
}, undefined, (e) => { window.__error = String(e); window.__done = true; });
</script>
</body>
</html>
