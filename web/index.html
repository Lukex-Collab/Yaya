<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>灵伴世界 · Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1026;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { width: 100%; height: 100%; }
  /* 加载遮罩 */
  #loading { position: fixed; inset: 0; background: linear-gradient(180deg,#0b1026,#1b2a4a);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #cfe3ff; z-index: 20; transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading h1 { font-size: 28px; letter-spacing: 6px; margin-bottom: 18px; }
  #loading .bar { width: 240px; height: 4px; background: #2a3a5f; border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 30%; background: #7fd0ff;
    border-radius: 2px; animation: slide 1.2s infinite; }
  @keyframes slide { 0%{margin-left:-30%} 100%{margin-left:100%} }
  #loading p { margin-top: 12px; font-size: 12px; opacity: .6; }
  /* HUD */
  .hud { position: fixed; z-index: 10; color: #eaf4ff; pointer-events: none; }
  #title { top: 16px; left: 20px; font-size: 15px; letter-spacing: 3px; opacity: .85; }
  #orbs { top: 16px; right: 20px; font-size: 15px; opacity: .9; }
  #hints { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px;
    opacity: .55; text-align: center; line-height: 1.8; }
  /* 想法气泡 */
  #bubble { position: fixed; z-index: 11; background: rgba(255,255,255,.92); color: #334;
    padding: 8px 14px; border-radius: 16px; font-size: 13px; max-width: 220px;
    opacity: 0; transition: opacity .4s; pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  #bubble::after { content: ""; position: absolute; bottom: -6px; left: 24px;
    border: 7px solid transparent; border-top-color: rgba(255,255,255,.92); border-bottom: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading"><h1>灵伴世界</h1><div class="bar"><i></i></div><p>正在唤醒牙牙…</p></div>
<div class="hud" id="title">灵伴世界 · 牙牙</div>
<div class="hud" id="orbs">✦ 灵光 0 / 10</div>
<div class="hud" id="hints">WASD 飞行 · Space / Shift 升降 · 拖动鼠标 环视 · 滚轮 缩放</div>
<div id="bubble"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
