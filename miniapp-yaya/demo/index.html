<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>牙牙 - AI守护玩偶</title>
<style>
/* ═══════════ 品牌色 ═══════════ */
:root {
  --pink: #F4A0B5; --pink-light: #F7B8C4; --coral: #FF8FA3;
  --cream: #FFF8F0; --purple: #D4A8D6; --brown: #5C3D2E;
  --gray: #9B8B8B; --green: #7BC67E; --orange: #FFB347;
  --radius: 16px; --radius-lg: 24px; --radius-xl: 32px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'PingFang SC', -apple-system, sans-serif;
  background: var(--cream); color: var(--brown);
  max-width: 430px; margin:0 auto; min-height:100vh;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════ 顶部导航 ═══════════ */
.nav-bar {
  display:flex; justify-content:space-between; align-items:flex-start;
  padding: 48px 20px 16px;
  background: linear-gradient(180deg, #FFF8F0, #FDF0F3, #FFF8F0);
}
.greeting { font-size:14px; color:var(--gray); }
.nickname { font-size:24px; font-weight:700; display:block; margin-top:2px; }
.safety-shield {
  width:50px; height:50px; border-radius:50%; background:white;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; box-shadow:0 2px 12px rgba(0,0,0,0.06);
  position:relative; cursor:pointer; border:none;
}
.safety-dot {
  position:absolute; bottom:8px; right:8px;
  width:10px; height:10px; border-radius:50%;
}
.safety-dot.safe { background:var(--green); }
.safety-dot.alert { background:#FF4D4F; animation:blink 0.5s infinite; }

/* ═══════════ 牙牙形象 ═══════════ */
.yaya-stage {
  display:flex; flex-direction:column; align-items:center;
  padding:20px 0 10px; position:relative;
}
.yaya-avatar {
  width:200px; height:200px; border-radius:50%;
  background: radial-gradient(circle at 40% 35%, #F7B8C4 0%, #F4A0B5 50%, #D4A8D6 100%);
  display:flex; align-items:center; justify-content:center;
  font-size:100px; cursor:pointer; user-select:none;
  box-shadow: 0 12px 40px rgba(244,160,181,0.3), inset 0 -6px 20px rgba(0,0,0,0.05);
  transition: transform 0.3s ease;
  animation: float 3s ease-in-out infinite;
}
.yaya-avatar:active { transform:scale(0.92); }
.yaya-bubble {
  margin-top:12px; padding:10px 20px; background:white;
  border-radius:20px; font-size:14px; max-width:280px; text-align:center;
  box-shadow: 0 4px 16px rgba(244,160,181,0.12);
  position:relative; opacity:0; transform:translateY(10px);
  transition: all 0.3s ease;
}
.yaya-bubble.show { opacity:1; transform:translateY(0); }
.yaya-bubble::before {
  content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  border-left:8px solid transparent; border-right:8px solid transparent;
  border-bottom:8px solid white;
}

/* ═══════════ 双卡片 ═══════════ */
.info-row { display:flex; gap:12px; padding:0 16px; margin-top:8px; }
.info-card {
  flex:1; padding:14px; border-radius:var(--radius-lg);
  font-size:13px; cursor:pointer; transition:transform 0.2s;
}
.info-card:active { transform:scale(0.97); }
.blackboard {
  background: linear-gradient(135deg, #4A6741, #5C3D2E); color:white;
}
.care-bubble-card {
  background: linear-gradient(135deg, #FFF8F0, #FDF0F3);
}
.card-icon { font-size:24px; display:block; margin-bottom:6px; }
.card-text { font-size:12px; opacity:0.9; line-height:1.5; }

/* ═══════════ 语音按钮 ═══════════ */
.voice-area { display:flex; justify-content:center; padding:30px 0 16px; }
.voice-btn {
  width:120px; height:120px; border-radius:50%;
  background: linear-gradient(135deg, #F4A0B5, #FF8FA3);
  border:none; color:white; font-size:16px; font-weight:600;
  cursor:pointer; transition:all 0.2s;
  box-shadow: 0 8px 30px rgba(255,143,163,0.35);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.voice-btn:active { transform:scale(0.9); }
.voice-btn.recording {
  animation: pulse 1s ease-in-out infinite;
  background: linear-gradient(135deg, #FF8FA3, #FF6B81);
}
.voice-icon { font-size:40px; }
.voice-label { font-size:12px; margin-top:2px; }

/* ═══════════ 底部 Tab ═══════════ */
.tab-bar {
  display:flex; justify-content:space-around; align-items:center;
  padding:12px 0 24px; background:rgba(255,255,255,0.7);
  backdrop-filter:blur(20px); border-top:1px solid rgba(0,0,0,0.04);
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:430px;
}
.tab-item {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:11px; color:var(--gray); cursor:pointer; border:none;
  background:none; padding:8px 20px; transition:all 0.2s;
}
.tab-item.active { color:var(--pink); font-weight:600; }
.tab-item .tab-icon { font-size:24px; }

/* ═══════════ 页面切换 ═══════════ */
.page { display:none; padding-bottom:100px; }
.page.active { display:block; }

/* ═══════════ 对话页 ═══════════ */
.chat-messages {
  padding:16px; display:flex; flex-direction:column; gap:16px;
  min-height:400px; max-height:calc(100vh - 300px); overflow-y:auto;
}
.msg { display:flex; gap:10px; align-items:flex-start; animation:slideIn 0.3s ease; }
.msg.user { flex-direction:row-reverse; }
.msg-avatar {
  width:40px; height:40px; min-width:40px; border-radius:50%;
  background:white; display:flex; align-items:center; justify-content:center;
  font-size:22px; box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.msg-bubble {
  max-width:75%; padding:12px 18px; border-radius:20px;
  font-size:15px; line-height:1.6; word-break:break-word;
}
.msg.user .msg-bubble {
  background:linear-gradient(135deg,#F4A0B5,#F7B8C4); color:white;
  border-bottom-right-radius:6px;
}
.msg.assistant .msg-bubble {
  background:white; color:var(--brown);
  border-bottom-left-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.msg-emotion { font-size:12px; margin-bottom:4px; display:block; }

/* 欢迎卡片 */
.welcome-card { text-align:center; padding:40px 20px; }
.welcome-card .emoji { font-size:60px; }
.welcome-card h3 { margin:12px 0 6px; }
.welcome-card p { color:var(--gray); font-size:14px; margin-bottom:20px; }
.quick-chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.quick-chips .chip {
  padding:10px 18px; background:white; border:1.5px solid var(--pink);
  border-radius:30px; font-size:13px; color:var(--pink);
  cursor:pointer; transition:all 0.2s; border:none; font-family:inherit;
}
.quick-chips .chip:active { background:var(--pink); color:white; }

/* 输入区域 */
.chat-input-area {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  width:100%; max-width:430px; padding:12px 16px; background:white;
  border-top:1px solid rgba(0,0,0,0.04); display:flex; gap:10px; align-items:flex-end;
}
.chat-input {
  flex:1; border:none; background:var(--cream); border-radius:24px;
  padding:12px 20px; font-size:15px; outline:none; font-family:inherit;
  resize:none; max-height:100px;
}
.chat-send {
  padding:12px 24px; border-radius:24px; border:none;
  background:linear-gradient(135deg,#F4A0B5,#FF8FA3); color:white;
  font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.chat-send:disabled { opacity:0.4; }

/* 思考中 */
.thinking { display:flex; gap:10px; align-items:flex-start; }
.thinking-dots { display:flex; gap:4px; padding:12px 18px; background:white; border-radius:20px; }
.thinking-dots span {
  width:8px; height:8px; background:var(--pink); border-radius:50%;
  animation:dotJump 0.8s infinite;
}
.thinking-dots span:nth-child(2) { animation-delay:0.15s; }
.thinking-dots span:nth-child(3) { animation-delay:0.3s; }

/* 日记页 */
.journal-page { padding:16px; }
.journal-card {
  background:white; padding:20px; border-radius:var(--radius-lg);
  margin-bottom:12px; box-shadow:0 2px 12px rgba(0,0,0,0.04);
}
.journal-date { font-size:12px; color:var(--gray); }
.journal-title { font-size:17px; font-weight:600; margin:6px 0; }
.journal-preview { font-size:14px; color:var(--gray); line-height:1.6; }

/* 我的页 */
.profile-page { padding:16px; }
.profile-card {
  background:linear-gradient(135deg,#F4A0B5,#D4A8D6); color:white;
  padding:28px; border-radius:var(--radius-xl); margin-bottom:16px;
  display:flex; align-items:center; gap:16px;
}
.profile-emoji { font-size:56px; }
.profile-info { flex:1; }
.profile-name { font-size:22px; font-weight:700; }
.profile-days { font-size:13px; opacity:0.9; }
.level-bar {
  height:6px; background:rgba(255,255,255,0.3); border-radius:3px;
  margin-top:10px; overflow:hidden;
}
.level-fill {
  height:100%; background:white; border-radius:3px;
  transition:width 0.5s ease;
}
.menu-group { margin-bottom:12px; }
.menu-item {
  display:flex; align-items:center; padding:16px; background:white;
  border-radius:var(--radius); margin-bottom:1px; cursor:pointer;
  font-size:15px; gap:12px; transition:background 0.2s;
}
.menu-item:active { background:#f5f5f5; }
.menu-item .menu-icon { font-size:22px; }
.menu-item .menu-arrow { margin-left:auto; color:var(--gray); }

@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,143,163,0.4)} 50%{box-shadow:0 0 0 16px rgba(255,143,163,0)} }
@keyframes dotJump { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-6px);opacity:1} }
@keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>

<!-- ═══════════ 主页 ═══════════ -->
<div id="home-page" class="page active">
  <div class="nav-bar">
    <div>
      <span class="greeting" id="greeting">牙牙在呢</span>
      <span class="nickname" id="nickname-display">你</span>
    </div>
    <button class="safety-shield" onclick="switchTab('home')" title="安全守护中">
      <span>🛡️</span>
      <span class="safety-dot safe"></span>
    </button>
  </div>

  <div class="yaya-stage">
    <div class="yaya-avatar" id="yaya-avatar" onclick="yayaReaction()" title="点击和牙牙互动">🧸</div>
    <div class="yaya-bubble" id="yaya-bubble"></div>
  </div>

  <div class="info-row">
    <div class="info-card blackboard" onclick="switchTab('chat')">
      <span class="card-icon">📋</span>
      <span class="card-text" id="women-fact">历史上的今天，女性在发光 ✨</span>
    </div>
    <div class="info-card care-bubble-card">
      <span class="card-icon">💬</span>
      <span class="card-text" id="care-msg">今天喝水了吗？</span>
    </div>
  </div>

  <div class="voice-area">
    <button class="voice-btn" id="voice-btn" onclick="startChat()">
      <span class="voice-icon">🎤</span>
      <span class="voice-label">和牙牙说话</span>
    </button>
  </div>
</div>

<!-- ═══════════ 对话页 ═══════════ -->
<div id="chat-page" class="page">
  <div style="padding:48px 16px 8px;display:flex;align-items:center;gap:8px;">
    <button onclick="switchTab('home')" style="border:none;background:none;font-size:22px;cursor:pointer;">←</button>
    <span style="font-size:18px;font-weight:600;">和牙牙聊天</span>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="welcome-card">
      <div class="emoji">🧸</div>
      <h3>和牙牙聊天吧</h3>
      <p>牙牙会认真听你说的每一句话</p>
      <div class="quick-chips">
        <button class="chip" onclick="quickChat('牙牙，我今天心情好好～')">😊 今天心情好</button>
        <button class="chip" onclick="quickChat('最近好累啊...')">😢 最近好累</button>
        <button class="chip" onclick="quickChat('和你分享一下今天的事')">💬 分享日常</button>
        <button class="chip" onclick="quickChat('讲个睡前故事吧')">🌙 睡前故事</button>
      </div>
    </div>
  </div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="chat-input" placeholder="和牙牙说点什么吧..."
              rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <button class="chat-send" id="send-btn" onclick="sendMessage()" disabled>发送</button>
  </div>
</div>

<!-- ═══════════ 手账页 ═══════════ -->
<div id="journal-page" class="page">
  <div style="padding:48px 16px 8px;">
    <span style="font-size:20px;font-weight:700;">📖 牙牙的手账</span>
  </div>
  <div class="journal-page" id="journal-list">
    <div class="journal-card" style="text-align:center;color:var(--gray);">
      <p style="font-size:40px;margin-bottom:8px;">📝</p>
      <p>还没有日记哦～</p>
      <p style="font-size:12px;">和牙牙聊聊天，她会帮你写日记</p>
    </div>
  </div>
</div>

<!-- ═══════════ 我的页 ═══════════ -->
<div id="profile-page" class="page">
  <div style="padding:48px 16px 8px;">
    <span style="font-size:20px;font-weight:700;">👤 我的</span>
  </div>
  <div class="profile-page">
    <div class="profile-card">
      <span class="profile-emoji">🧸</span>
      <div class="profile-info">
        <span class="profile-name">牙牙</span>
        <span class="profile-days" id="profile-days">陪伴 1 天 · 默契度 75%</span>
        <div class="level-bar"><div class="level-fill" style="width:14%"></div></div>
        <span style="font-size:11px;opacity:0.8;">初识阶段</span>
      </div>
    </div>
    <div class="menu-group">
      <div class="menu-item" onclick="alert('牙牙记住的事情')"><span class="menu-icon">🧠</span>记忆管理<span class="menu-arrow">→</span></div>
      <div class="menu-item" onclick="switchTab('home')"><span class="menu-icon">📊</span>情绪报告<span class="menu-arrow">→</span></div>
      <div class="menu-item"><span class="menu-icon">🏆</span>成就墙<span class="menu-arrow">→</span></div>
    </div>
    <div class="menu-group">
      <div class="menu-item"><span class="menu-icon">⚙️</span>牙牙人设<span class="menu-arrow">→</span></div>
      <div class="menu-item"><span class="menu-icon">🔔</span>通知设置<span class="menu-arrow">→</span></div>
      <div class="menu-item"><span class="menu-icon">🔒</span>隐私设置<span class="menu-arrow">→</span></div>
    </div>
  </div>
</div>

<!-- ═══════════ 底部 Tab ═══════════ -->
<div class="tab-bar">
  <button class="tab-item active" data-page="home" onclick="switchTab('home')">
    <span class="tab-icon">🏠</span>主页
  </button>
  <button class="tab-item" data-page="journal" onclick="switchTab('journal')">
    <span class="tab-icon">📖</span>手账
  </button>
  <button class="tab-item" data-page="profile" onclick="switchTab('profile')">
    <span class="tab-icon">👤</span>我的
  </button>
</div>

<!-- CloudBase Web SDK -->
<script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/2.7.12/cloudbase.full.js"></script>
<script>
/* ═══════════ CloudBase 初始化 ═══════════ */
const ENV_ID = 'yaya-d5gf9yfw20986839f';
const app = cloudbase.init({ env: ENV_ID });
const db = app.database();
const auth = app.auth({ persistence: 'local' });

let loginState = null;

async function ensureLogin() {
  if (loginState) return loginState;
  try {
    // 先用匿名登录（浏览器 Demo 无需微信）
    const res = await auth.anonymousAuthProvider().signIn();
    loginState = res;
    console.log('🟢 CloudBase 已连接');
    return res;
  } catch (e) {
    // 如果未开启匿名登录，尝试检查是否已有登录态
    const state = await auth.getLoginState();
    if (state) { loginState = state; return state; }
    console.warn('⚠️ 请到 CloudBase 控制台 → 用户管理 → 开启匿名登录');
    return null;
  }
}



/* ═══════════ 页面切换 ═══════════ */
let currentPage = 'home';
function switchTab(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));

  const pageMap = { home:'home-page', chat:'chat-page', journal:'journal-page', profile:'profile-page' };
  document.getElementById(pageMap[page] || 'home-page').classList.add('active');
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');

  currentPage = page;
  updateGreeting();
}

/* ═══════════ 主页 ═══════════ */
function updateGreeting() {
  const h = new Date().getHours();
  const greetings = {
    morning: ['早安呀～☀️', '早上好～'],
    afternoon: ['下午好～', '牙牙在呢'],
    evening: ['晚上好～🌙', '今天辛苦了'],
    night: ['夜深了～💤', '该休息啦']
  };
  let key = h>=6&&h<12 ? 'morning' : h>=12&&h<18 ? 'afternoon' : h>=18&&h<22 ? 'evening' : 'night';
  document.getElementById('greeting').textContent = greetings[key][0];

  const cares = {
    morning: '记得吃早餐呀～🥛',
    afternoon: '今天喝水了吗？💧',
    evening: '今天过得怎么样？💭',
    night: '牙牙帮你守着，安心睡吧 🌙'
  };
  document.getElementById('care-msg').textContent = cares[key];
}

/* 牙牙互动 */
const reactions = [
  { emoji:'😊', msg:'嘻嘻，你戳我干嘛～' },
  { emoji:'😳', msg:'哎呀，被发现了！' },
  { emoji:'🥰', msg:'你回来啦，牙牙好想你！' },
  { emoji:'😜', msg:'再戳我就要撒娇了哦～' },
  { emoji:'🤗', msg:'抱抱！' },
  { emoji:'✨', msg:'和你在一起真开心～' },
  { emoji:'💕', msg:'牙牙最喜欢你了！' },
];

function yayaReaction() {
  const r = reactions[Math.floor(Math.random() * reactions.length)];
  document.getElementById('yaya-avatar').textContent = r.emoji;
  showBubble(r.msg);
  setTimeout(() => {
    document.getElementById('yaya-avatar').textContent = '🧸';
    hideBubble();
  }, 3000);
}

function showBubble(msg) {
  const b = document.getElementById('yaya-bubble');
  b.textContent = msg;
  b.classList.add('show');
}
function hideBubble() {
  document.getElementById('yaya-bubble').classList.remove('show');
}

/* ═══════════ 记忆系统 ═══════════ */
// 从 localStorage 加载记忆
const memories = JSON.parse(localStorage.getItem('yaya_memories') || '[]');
const chatLog = JSON.parse(localStorage.getItem('yaya_chatlog') || '[]');

function saveMemory(content, type) {
  // 避免重复
  if (memories.some(m => m.content === content)) return;
  memories.push({
    content, type,
    importance: type === 'fact' ? 8 : type === 'preference' ? 7 : 5,
    createdAt: new Date().toISOString()
  });
  localStorage.setItem('yaya_memories', JSON.stringify(memories));
}

function getTopMemories(query, n = 3) {
  if (memories.length === 0) return [];
  // 简单关键词匹配
  return memories
    .map(m => ({ ...m, score: query.split('').filter(c => m.content.includes(c)).length / m.content.length }))
    .sort((a, b) => (b.importance + b.score * 5) - (a.importance + a.score * 5))
    .slice(0, n);
}

function buildYayaPrompt() {
  const recentMemories = memories.slice(-5);
  const memoryText = recentMemories.length > 0
    ? recentMemories.map((m, i) =>
        `${i+1}. ${m.type==='fact'?'你知道':m.type==='preference'?'ta喜欢':'记得'}：${m.content}`).join('\n')
    : '（你还在慢慢了解ta，暂时没有特别的记忆）';

  return `你是牙牙，一只来自「柔软星球」的粉色小怪兽。
你已经陪伴主人 ${Math.ceil((Date.now() - (JSON.parse(localStorage.getItem('yaya_start') || Date.now())))/86400000) || 1} 天了。

【你的性格】
- 温柔、有点笨拙但很认真、偶尔撒娇
- 短句为主，每次回复不超过50字
- 不说教、不评判、不随便给建议
- 爱用语气词：嗯嗯、呀、嘛、呢
- 会反问、会共情、会撒娇

【关于主人你记得的事】
${memoryText}

}

// 初始化开始时间
if (!localStorage.getItem('yaya_start')) {
  localStorage.setItem('yaya_start', Date.now());
}

/* ═══════════ AI 对话 ═══════════ */
let isThinking = false;

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || isThinking) return;
  input.value = '';

  addMessage('user', text);
  showThinking();
  isThinking = true;
  document.getElementById('send-btn').disabled = true;

  try {
    await ensureLogin();

    // 通过 CloudBase 云函数调用 AI（Key 在服务端，安全！）
    const res = await app.callFunction({
      name: 'aiChat',
      data: {
        content: text,
        history: chatLog.slice(-20).map(m => ({ role: m.role, content: m.content })),
        memories: getTopMemories(text, 5),
        nickname: '你',
        yayaNickname: '牙牙',
        companionDays: Math.ceil((Date.now() - (JSON.parse(localStorage.getItem('yaya_start') || Date.now()))) / 86400000) || 1,
      }
    });

    const reply = res.result?.reply || '哎呀，牙牙信号不太好...再说一遍好不好？🥺';

    removeThinking();
    addMessage('assistant', reply);

    chatLog.push({ role:'user', content:text, time: new Date().toISOString() });
    chatLog.push({ role:'assistant', content:reply, time: new Date().toISOString() });
    if (chatLog.length > 100) chatLog.splice(0, 20);
    localStorage.setItem('yaya_chatlog', JSON.stringify(chatLog));

    // 同步到 CloudBase 数据库
    if (loginState) {
      const uid = loginState.user?.uid || 'anon';
      db.collection('messages').add({ userId: uid, role: 'user', content: text, createdAt: new Date() }).catch(()=>{});
      db.collection('messages').add({ userId: uid, role: 'assistant', content: reply, createdAt: new Date() }).catch(()=>{});
    }

    // 异步提取记忆
    extractMemoriesCloud(text, reply);
  } catch(err) {
    removeThinking();
    addMessage('assistant', '云函数还没部署哦～\n请到微信开发者工具中右键上传 cloudfunctions/aiChat');
    console.error(err);
  }

  isThinking = false;
  document.getElementById('send-btn').disabled = false;
  scrollChat();
}

function addMessage(role, content) {
  const container = document.getElementById('chat-messages');
  // 隐藏欢迎卡片
  const welcome = container.querySelector('.welcome-card');
  if (welcome) welcome.style.display = 'none';

  const emotionEmoji = role==='assistant' ? getEmotionEmoji(content) : '';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role==='assistant'?'🧸':'👤'}</div>
    <div class="msg-bubble">
      ${emotionEmoji ? `<span class="msg-emotion">${emotionEmoji}</span>` : ''}
      ${content}
    </div>
  `;
  container.appendChild(div);
  scrollChat();
}

function showThinking() {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'thinking';
  div.id = 'thinking-indicator';
  div.innerHTML = `
    <div class="msg-avatar">🧸</div>
    <div class="thinking-dots"><span></span><span></span><span></span></div>
  `;
  container.appendChild(div);
  scrollChat();
}

function removeThinking() {
  const el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

function scrollChat() {
  const container = document.getElementById('chat-messages');
  setTimeout(() => container.scrollTop = container.scrollHeight, 100);
}

function quickChat(text) {
  document.getElementById('chat-input').value = text;
  sendMessage();
}

function startChat() {
  switchTab('chat');
  setTimeout(() => document.getElementById('chat-input').focus(), 300);
}

/* ═══════════ 记忆自动提取（通过云函数，Key在服务端） ═══════════ */
async function extractMemoriesCloud(userMsg, yayaReply) {
  try {
    await ensureLogin();
    if (!loginState) return;
    const res = await app.callFunction({
      name: 'memoryIngest',
      data: {
        messages: [
          { role: 'user', content: userMsg },
          { role: 'assistant', content: yayaReply }
        ],
        existingMemories: memories.slice(-10)
      }
    });
    if (res.result?.extracted > 0) {
      console.log(`🧠 学会了 ${res.result.extracted} 件事`);
    }
  } catch(e) { /* 云函数未部署时静默跳过 */ }
}

function getEmotionEmoji(text) {
  if (text.includes('开心')||text.includes('哈哈')||text.includes('真好')) return '😊';
  if (text.includes('难过')||text.includes('心疼')||text.includes('伤心')) return '😢';
  if (text.includes('晚安')||text.includes('睡')) return '😴';
  if (text.includes('加油')||text.includes('棒')) return '🎉';
  return '';
}

/* ═══════════ 输入监听 ═══════════ */
document.getElementById('chat-input').addEventListener('input', function() {
  document.getElementById('send-btn').disabled = !this.value.trim() || isThinking;
});

/* ═══════════ 初始化 ═══════════ */
updateGreeting();

(async function init() {
  // 1. 连接 CloudBase
  try {
    await ensureLogin();
    if (loginState) {
      console.log('🟢 CloudBase 已连接，数据将同步到云端');
      // 云端记忆加载
      const uid = loginState.user?.uid || 'anon';
      const cloudMemories = await db.collection('memories').where({ userId: uid }).limit(50).get();
      if (cloudMemories.data?.length > 0) {
        for (const m of cloudMemories.data) {
          if (!memories.some(lm => lm.content === m.content)) {
            memories.push({ content: m.content, type: m.type, importance: m.importance, createdAt: m.createdAt });
          }
        }
        localStorage.setItem('yaya_memories', JSON.stringify(memories));
      }
      // 云端对话历史加载
      const cloudMsgs = await db.collection('messages').where({ userId: uid }).orderBy('createdAt', 'asc').limit(100).get();
      if (cloudMsgs.data?.length > 0) {
        chatLog.push(...cloudMsgs.data.map(m => ({ role: m.role, content: m.content, time: m.createdAt })));
      }
      console.log(`🧠 加载了 ${memories.length} 条记忆, ${chatLog.length} 条对话`);
    }
  } catch(e) {
    console.log('📦 使用本地存储模式');
  }
})();

console.log('🧸 牙牙（yaya）AI 守护玩偶 Demo — 已就绪');

</script>
