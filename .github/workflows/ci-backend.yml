name: CI

on:
  pull_request:
    paths: ['server/**', 'miniapp-yaya/**']
  push:
    branches: [master, main]

jobs:
  # ═══════════════════════
  # 合并冲突检测（仅 PR）
  # ═══════════════════════
  conflict-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检测合并冲突
        run: |
          TARGET="${{ github.base_ref }}"
          git fetch origin "${TARGET}"
          if git merge-tree $(git merge-base HEAD "origin/${TARGET}") HEAD "origin/${TARGET}" 2>&1 | grep -qP '^\+<<<<<<< '; then
            echo "❌ 检测到合并冲突！请在本地解决: git rebase origin/${TARGET}"
            exit 1
          fi
          echo "✅ 无合并冲突"

  # ═══════════════════════
  # Commit 格式检查（仅 PR）
  # ═══════════════════════
  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验 Commit 格式
        run: |
          TARGET="${{ github.base_ref }}"
          git fetch origin "${TARGET}"
          COMMITS=$(git log "origin/${TARGET}..HEAD" --format="%H %s")
          if [ -z "$COMMITS" ]; then echo "无新提交"; exit 0; fi
          HAS_ERROR=0
          while IFS= read -r line; do
            HASH=$(echo "$line" | cut -d' ' -f1 | cut -c1-7)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            if echo "$MSG" | grep -qP '^(feat|fix|refactor|docs|style|test|chore|perf|ci|build|revert)(\([a-z0-9/-]+\))?: .+'; then
              echo "  ✅ $HASH $MSG"
            else
              echo "  ❌ $HASH $MSG"
              HAS_ERROR=1
            fi
          done <<< "$COMMITS"
          if [ $HAS_ERROR -eq 1 ]; then
            echo "格式要求: <type>(<scope>): <subject>"
            exit 1
          fi
          echo "✅ Commit 格式正确"

  # ═══════════════════════
  # 代码检查 + 测试
  # ═══════════════════════
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      DEEPSEEK_API_KEY: test-key
      JWT_SECRET: ci-test-secret
      GATEWAY_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true, cache-dependency-path: server/go.sum }
      - name: go vet
        run: cd server && go vet ./...
      - name: 单元测试
        run: cd server && go test ./... -v -cover -count=1 -short
        timeout-minutes: 5

  # ═══════════════════════
  # 编译检查
  # ═══════════════════════
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: cd server && CGO_ENABLED=0 go build -o /dev/null ./cmd/server
      - run: cd server && CGO_ENABLED=0 go build -o /dev/null ./cmd/migrate

  # ═══════════════════════
  # Docker 构建检查
  # ═══════════════════════
  docker:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t yaya-server -f server/Dockerfile server/
