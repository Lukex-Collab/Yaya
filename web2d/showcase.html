<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>灵伴世界 · 宠物展示</title>
<style>
  :root {
    --night: #070718;
    --ink: #eef0ff;
    --gold: #ffd98a;
    --gold-soft: #ffe9bd;
    --lilac: #c9b8ff;
    --chip-bg: rgba(18, 20, 46, .55);
    --serif: "Noto Serif SC", "Songti SC", serif;
    --sans: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--night); color: var(--ink); min-height: 100%; font-family: var(--sans); }
  header { position: sticky; top: 0; z-index: 5; padding: 18px 22px; display: flex; align-items: center; gap: 14px;
    background: linear-gradient(180deg, rgba(7,7,24,.94), rgba(7,7,24,.74)); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.08); }
  header a { color: var(--lilac); text-decoration: none; font-size: 13px; letter-spacing: 2px;
    padding: 7px 16px; border: 1px solid rgba(201,184,255,.35); border-radius: 999px; background: var(--chip-bg);
    white-space: nowrap; }
  header a:active { transform: scale(.96); }
  header h1 { font-family: var(--serif); font-weight: 700; letter-spacing: 5px; font-size: 18px; color: var(--gold);
    text-shadow: 0 0 16px rgba(255,217,138,.4); }
  header p { margin-left: auto; font-size: 11px; opacity: .55; letter-spacing: 2px; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px;
    padding: 26px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--chip-bg); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 32px rgba(0,0,0,.35); }
  .card video { width: 100%; display: block; aspect-ratio: 1170 / 1080; background: #000; object-fit: cover; }
  .card .cap { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card .cap b { font-family: var(--serif); letter-spacing: 3px; color: var(--gold-soft); }
  .card .cap span { font-size: 11px; opacity: .55; white-space: nowrap; }
  .card .fallback { display: none; padding: 36px 20px; text-align: center; font-size: 13px; opacity: .65;
    line-height: 2; border-top: 1px dashed rgba(255,255,255,.14); }
  footer { text-align: center; padding: 20px; font-size: 11px; opacity: .45; letter-spacing: 2px; }
</style>
</head>
<body>
<header>
  <a id="backLink" href="./index.html">← 返回小世界</a>
  <h1>宠物展示</h1>
  <p>AI 生成演示视频</p>
</header>
<div class="grid" id="g"></div>
<footer>演示视频为本地资源（assets/videos/），未随仓库上传</footer>
<script>
const backLink = document.getElementById('backLink');
if (location.search) backLink.href = './index.html' + location.search;

const VIDEOS = [
  { src: '../assets/videos/v1.mp4', title: '展示视频 · 01' },
  { src: '../assets/videos/v2.mp4', title: '展示视频 · 02' },
  { src: '../assets/videos/v3.mp4', title: '展示视频 · 03' },
];
const g = document.getElementById('g');
for (const v of VIDEOS) {
  const card = document.createElement('div');
  card.className = 'card';

  const vid = document.createElement('video');
  vid.src = v.src;
  vid.loop = true;
  vid.muted = true;
  vid.controls = true;
  vid.playsInline = true;
  vid.addEventListener('error', () => {
    vid.style.display = 'none';
    card.querySelector('.fallback').style.display = 'block';
  });

  const cap = document.createElement('div');
  cap.className = 'cap';
  const b = document.createElement('b');
  b.textContent = v.title;
  const s = document.createElement('span');
  s.textContent = 'MiniMax · 1170×1080';
  cap.append(b, s);

  const fb = document.createElement('div');
  fb.className = 'fallback';
  fb.textContent = '演示视频未随仓库上传，请在本地 assets/videos/ 目录下运行后查看';

  card.append(vid, cap, fb);
  g.appendChild(card);
}
</script>
</body>
</html>
