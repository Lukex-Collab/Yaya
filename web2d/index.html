<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>灵伴世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #070718;
    --ink: #eef0ff;
    --gold: #ffd98a;
    --gold-soft: #ffe9bd;
    --lilac: #c9b8ff;
    --lilac-deep: #b39dff;
    --chip-bg: rgba(18, 20, 46, .42);
    --chip-line: rgba(255, 255, 255, .14);
    --serif: "Noto Serif SC", "Songti SC", serif;
    --sans: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--night);
    font-family: var(--sans); touch-action: none; overscroll-behavior: none; }
  canvas { display: block; }
  .hud { position: fixed; z-index: 10; color: var(--ink); pointer-events: none; }

  .chip { background: var(--chip-bg); border: 1px solid var(--chip-line);
    border-radius: 999px; padding: 9px 18px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }

  #title { top: 18px; left: 20px; font-family: var(--serif); font-weight: 700;
    font-size: 15px; letter-spacing: 4px;
    text-shadow: 0 0 14px rgba(201,184,255,.45); }
  #level { top: 66px; left: 20px; font-size: 11px; letter-spacing: 2px;
    padding: 6px 14px; opacity: .85; color: var(--lilac); }
  #weather { top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 2px; padding: 7px 14px; opacity: .8; }

  #orbs { top: 18px; right: 20px; font-size: 14px; letter-spacing: 1px;
    color: var(--gold-soft); text-shadow: 0 0 12px rgba(255,217,138,.5); }
  #orbs.pop { animation: pop .4s cubic-bezier(.2,.8,.3,1.4); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

  #hints { bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 11px;
    letter-spacing: 3px; opacity: .45; transition: opacity 1.2s; white-space: nowrap;
    text-shadow: 0 0 8px rgba(127,208,255,.4); }

  #toast { top: 84px; left: 50%; transform: translateX(-50%) translateY(12px);
    text-align: center; opacity: 0; transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
    font-family: var(--serif); font-weight: 700; font-size: 30px; letter-spacing: 10px;
    color: #ffffff; text-shadow: 0 0 24px rgba(201,184,255,.55), 0 2px 10px rgba(0,0,0,.5); }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.gold { color: var(--gold-soft);
    text-shadow: 0 0 28px rgba(255,217,138,.65), 0 2px 10px rgba(0,0,0,.5); }
  #toast .rule { display: block; width: 52px; height: 1px; margin: 12px auto 10px;
    background: linear-gradient(90deg, transparent, rgba(255,217,138,.85), transparent); }
  #toast .toast-desc { display: block; font-family: var(--sans); font-weight: 400;
    font-size: 12px; letter-spacing: 5px; opacity: .72;
    text-shadow: 0 0 10px rgba(127,208,255,.4); }

  #bubble { position: fixed; z-index: 11; background: rgba(255,255,255,.9); color: #3a3a55;
    padding: 9px 15px; border-radius: 18px; font-size: 13px; max-width: 230px; line-height: 1.5;
    opacity: 0; transition: opacity .4s; pointer-events: none;
    border: 1px solid rgba(255,255,255,.7); box-shadow: 0 8px 24px rgba(10,10,40,.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  #bubble::after { content: ""; position: absolute; bottom: -6px; left: 24px;
    border: 7px solid transparent; border-top-color: rgba(255,255,255,.9); border-bottom: 0; }

  #vignette { position: fixed; inset: 0; z-index: 8; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 42%, transparent 58%, rgba(4,4,22,.52) 100%),
      linear-gradient(180deg, rgba(4,4,22,.28) 0%, transparent 18%); }
  #pulse { position: fixed; inset: 0; z-index: 9; background: #d9ccff;
    opacity: 0; transition: opacity .45s ease-out; pointer-events: none; }

  #joy-base { position: fixed; z-index: 12; width: 128px; height: 128px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.28);
    background: radial-gradient(circle at 50% 42%, rgba(255,255,255,.10), rgba(255,255,255,.03) 65%);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 0 26px rgba(201,184,255,.28), inset 0 0 20px rgba(201,184,255,.12);
    transform: translate(-50%,-50%); opacity: 0; transition: opacity .15s; pointer-events: none; }
  #joy-thumb { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #dcccff 55%, var(--lilac-deep));
    box-shadow: 0 0 20px rgba(201,184,255,.6), inset 0 -3px 8px rgba(120,90,220,.35);
    transform: translate(-50%,-50%); }

  #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: var(--night); pointer-events: none; }
  #loading .load-star { color: var(--gold); font-size: 30px;
    text-shadow: 0 0 26px rgba(255,217,138,.9); animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle {
    0%,100% { opacity: .35; transform: scale(.85) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.1) rotate(20deg); } }
  #loading .load-word { font-family: var(--serif); font-weight: 700; font-size: 22px;
    letter-spacing: 12px; text-indent: 12px; color: var(--ink); }
  #loading #load-pct { font-size: 11px; letter-spacing: 4px; opacity: .5; color: var(--ink); }

  /* 功能键 */
  .fbtn { position: fixed; z-index: 12; right: 18px; width: 48px; height: 48px; border-radius: 50%;
    background: var(--chip-bg); border: 1px solid rgba(201,184,255,.3); color: #e6dcff;
    font-size: 19px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
    transition: transform .15s, box-shadow .2s; }
  .fbtn:active { transform: scale(.92); box-shadow: 0 0 18px rgba(201,184,255,.45); }
  #btnChat { bottom: 148px; }
  #btnDiary { bottom: 88px; }
  #btnDispatch { bottom: 28px; }
  #btnShow { bottom: 208px; }
  #btnFeed { bottom: 268px; }
  #btnCheckin { bottom: 328px; }
  #btnCodex { bottom: 388px; }
  #btnAction { right: 80px; bottom: 28px; width: auto; padding: 0 18px; height: 48px;
    border-radius: 999px; font-size: 13px; letter-spacing: 2px; display: none;
    color: var(--gold-soft); border-color: rgba(255,217,138,.5);
    background: rgba(46,36,18,.5); text-shadow: 0 0 10px rgba(255,217,138,.5); }

  /* 聊天面板 */
  #chat { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: 46%;
    background: rgba(12, 14, 36, .82); border-top: 1px solid rgba(201,184,255,.22);
    border-radius: 22px 22px 0 0; transform: translateY(105%);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    display: flex; flex-direction: column; }
  #chat.open { transform: translateY(0); }
  #chatMsgs { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 14px; line-height: 1.55; }
  .msg.pet { background: rgba(255,255,255,.94); color: #3a3a55; align-self: flex-start;
    border-bottom-left-radius: 5px; box-shadow: 0 4px 14px rgba(10,10,40,.25); }
  .msg.me { background: linear-gradient(135deg, #cdb9ff, #ffd98a); color: #241a45;
    align-self: flex-end; border-bottom-right-radius: 5px;
    box-shadow: 0 4px 14px rgba(179,157,255,.3); }
  #chatBar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(255,255,255,.08); }
  #chatInput { flex: 1; background: rgba(255,255,255,.08); border: 1px solid rgba(201,184,255,.3);
    border-radius: 999px; color: #fff; padding: 11px 18px; font-size: 14px; outline: none; }
  #chatInput::placeholder { color: rgba(238,240,255,.35); }
  #chatInput:focus { border-color: rgba(201,184,255,.6); box-shadow: 0 0 14px rgba(201,184,255,.25); }
  #chatSend { background: linear-gradient(135deg, #cdb9ff, #ffd98a); border: none; border-radius: 999px;
    color: #241a45; font-weight: bold; padding: 0 22px; font-size: 14px; cursor: pointer; }

  /* 手账面板 */
  #diary { position: fixed; z-index: 20; inset: 6% 8%; background: #f8f1e4; color: #4a4038;
    border-radius: 18px; padding: 28px; transform: scale(.92) translateY(8px); opacity: 0;
    pointer-events: none; transition: all .3s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 0 60px rgba(190,170,130,.15);
    overflow-y: auto; }
  #diary.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: auto; }
  #diary h3 { font-family: var(--serif); font-weight: 700; letter-spacing: 6px; margin-bottom: 14px;
    color: #5a4a35; border-bottom: 1px solid rgba(150,130,95,.3); padding-bottom: 10px; }
  #diaryBody { font-size: 15px; line-height: 2; white-space: pre-wrap; }
  #diaryInv { margin-top: 16px; padding-top: 12px; border-top: 1px dashed #c9bda8;
    font-size: 13px; line-height: 1.9; color: #7a6f5f; }
  #diaryClose { position: absolute; top: 12px; right: 16px; font-size: 20px; color: #a89a80;
    background: none; border: none; cursor: pointer; }

  /* 图鉴面板 */
  #codex { position: fixed; z-index: 20; inset: 5% 6%; background: rgba(12,14,36,.96); color: var(--ink);
    border: 1px solid rgba(201,184,255,.25); border-radius: 20px; padding: 24px; overflow-y: auto;
    transform: scale(.94) translateY(10px); opacity: 0; pointer-events: none;
    transition: all .28s cubic-bezier(.2,.8,.2,1); box-shadow: 0 20px 60px rgba(0,0,0,.55);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  #codex.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: auto; }
  #codex h3 { font-family: var(--serif); letter-spacing: 6px; color: var(--gold); margin-bottom: 12px; }
  #codex h4 { font-family: var(--serif); letter-spacing: 4px; color: var(--lilac); margin: 18px 0 10px; }
  #codexClose { position: absolute; top: 12px; right: 16px; font-size: 20px; color: var(--lilac);
    background: none; border: none; cursor: pointer; }
  #codexPets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cx-card { background: var(--chip-bg); border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    padding: 10px 8px; text-align: center; }
  .cx-card.owned { border-color: rgba(255,217,138,.6); box-shadow: 0 0 16px rgba(255,217,138,.18); }
  .cx-card img { width: 64px; height: 64px; object-fit: contain; }
  .cx-card b { display: block; margin-top: 4px; font-family: var(--serif); letter-spacing: 2px; }
  .cx-card .cx-tag { display: inline-block; margin: 4px 0; font-size: 10px; padding: 2px 8px;
    border-radius: 999px; background: rgba(201,184,255,.14); color: var(--lilac); }
  .cx-card.owned .cx-tag { background: rgba(255,217,138,.16); color: var(--gold-soft); }
  .cx-card small { display: block; font-size: 10px; opacity: .6; }
  .cx-card i { display: block; font-style: normal; font-size: 11px; opacity: .8; margin-top: 3px; }
  #codexAch { display: flex; flex-direction: column; gap: 6px; }
  .cx-ach { font-size: 12px; padding: 7px 12px; border-radius: 10px; background: var(--chip-bg);
    border: 1px solid rgba(255,255,255,.08); color: #8f8fb5; }
  .cx-ach.done { color: var(--gold-soft); border-color: rgba(255,217,138,.35); }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div class="hud chip" id="title">灵伴世界</div>
<div class="hud chip" id="level">Lv.1 · 亲密 0</div>
<div class="hud chip" id="weather"></div>
<div class="hud chip" id="orbs">✦ 灵光 0 / 14</div>
<div class="hud" id="hints">WASD / 触屏拖动 移动 · 💬聊天 📖手账 🎒派遣 🎬展示 ✨签到 🥣喂食 📔图鉴</div>
<div class="hud" id="toast"></div>
<div id="bubble"></div>
<div id="vignette"></div>
<div id="pulse"></div>
<div id="joy-base"><div id="joy-thumb"></div></div>
<div id="loading">
  <div class="load-star">✦</div>
  <div class="load-word">灵伴世界</div>
  <div id="load-pct">加载中</div>
</div>

<button class="fbtn" id="btnChat">💬</button>
<button class="fbtn" id="btnDiary">📖</button>
<button class="fbtn" id="btnDispatch">🎒</button>
<button class="fbtn" id="btnShow">🎬</button>
<button class="fbtn" id="btnFeed">🥣</button>
<button class="fbtn" id="btnCheckin">✨</button>
<button class="fbtn" id="btnCodex">📔</button>
<button class="fbtn" id="btnAction"></button>

<div id="chat">
  <div id="chatMsgs"></div>
  <div id="chatBar">
    <input id="chatInput" placeholder="和它说点什么…" maxlength="100">
    <button id="chatSend">发送</button>
  </div>
</div>

<div id="diary">
  <button id="diaryClose">✕</button>
  <h3 id="diaryTitle">手账</h3>
  <div id="diaryBody"></div>
  <div id="diaryInv"></div>
</div>

<div id="codex">
  <button id="codexClose">✕</button>
  <h3>图鉴 · 八灵</h3>
  <div id="codexPets"></div>
  <h4>🏆 成就</h4>
  <div id="codexAch"></div>
</div>

<script src="./ai.js"></script>
<script src="./play.js"></script>
<script src="./main.js"></script>
</body>
</html>
